services:
  druckkammer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ukeha/druckkammer:latest
    container_name: druckkammer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Druckkammer__DataDirectory=/data
      - Druckkammer__ImportDirectory=/import
      # Optional: OpenID Connect (SSO) via Umgebungsvariablen (alternativ direkt im Admin-Menü konfigurierbar)
      # - Druckkammer__OpenIdConnect__Enabled=true
      # - Druckkammer__OpenIdConnect__ProviderName=Authentik SSO
      # - Druckkammer__OpenIdConnect__Authority=https://auth.example.com/application/o/druckkammer
      # - Druckkammer__OpenIdConnect__ClientId=druckkammer
      # - Druckkammer__OpenIdConnect__ClientSecret=your-secret
    volumes:
      # Verwalteter App-Speicher (SQLite Datenbank, kopierte Modelle, Thumbnails, Makes-Fotos)
      - ./data:/data
      # Quell-Ordner für den Verzeichnis-Scanner (z.B. NAS-Mount mit Patreon-Bundles; wird nur gelesen & kopiert)
      - ./import:/import:ro
